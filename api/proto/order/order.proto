syntax = "proto3";

package order;

option go_package = "go-grpc-demo/api/proto/order" ;

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}

message CreateOrderRequest {
  int64 user_id    = 1;
  int64 product_id = 2;
  int32 amount     = 3;
}

message CreateOrderResponse {
  int64  order_id = 1;
  string status   = 2;
  string message  = 3;
}

message GetOrderRequest {
  int64 order_id = 1;
}

message GetOrderResponse {
  int64  order_id   = 1;
  int64  user_id    = 2;
  int64  product_id = 3;
  int32  amount     = 4;
  string status     = 5;
}